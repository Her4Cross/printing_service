<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Printing Service</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f5f5f5;
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{

            width:420px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);

        }

        h2{

            margin-top:0;
            text-align:center;

        }

        label{

            font-weight:bold;

        }

        input{

            width:100%;
            box-sizing:border-box;
            padding:10px;
            font-size:16px;
            margin-top:5px;
            margin-bottom:20px;

        }

        button{

            width:100%;
            padding:12px;
            font-size:17px;
            cursor:pointer;
            border:none;
            border-radius:6px;
            background:#1976d2;
            color:white;

        }

        button:hover{

            background:#0d47a1;

        }

        #status{

            margin-top:20px;
            text-align:center;
            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="card">

    <h2>Barcode Printing Service</h2>

    <label>Código de barras</label>

    <input
            type="text"
            id="barcode"
            placeholder="Ej: ABC123456">

    <label>Cantidad</label>

    <input
            type="number"
            id="quantity"
            min="1"
            value="1">

    <button onclick="printLabel()">
        Imprimir
    </button>

    <div id="status"></div>

</div>

<script>

async function printLabel(){

    const barcode=document.getElementById("barcode").value.trim();

    const quantity=parseInt(document.getElementById("quantity").value);

    if(barcode===""){

        alert("Ingrese un código.");

        return;

    }

    const response=await fetch("/print",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            barcode:barcode,
            quantity:quantity

        })

    });

    const data=await response.json();

    const status=document.getElementById("status");

    if(response.ok){

        status.style.color="green";
        status.innerHTML=data.message;

    }
    else{

        status.style.color="red";
        status.innerHTML=data.detail;

    }

}

</script>

</body>

</html>
